name: "rpmlint"
description: "run rpmlint"
author: "@shogo82148"
inputs:
  github_token:
    description: "GITHUB_TOKEN."
    default: "${{ github.token }}"
    required: true
  rpmlint_flags:
    description: "Additional rpmlint flags"
    default: ""
    required: false
runs:
  using: "docker"
  image: 'docker://ghcr.io/shogo82148/actions-rpmlint:v0.2.5@sha256:626bd2c2184e65835658666d8ce66371958c20bfff38b4f4fb0934397a7598b9'
branding:
  color: red
  icon: check-circle
