name: "rpmlint"
description: "run rpmlint"
author: "@shogo82148"
inputs:
  github_token:
    description: "GITHUB_TOKEN."
    default: "${{ github.token }}"
    required: true
  rpmlint_flags:
    description: "Additional rpmlint flags"
    default: ""
    required: false
runs:
  using: "docker"
  image: 'docker://ghcr.io/shogo82148/actions-rpmlint:v0.2.2@sha256:70ec8130103fce6c6a98f3ebd67297a5e98796fc6d5fbb221a29fd6a7844a22f'
branding:
  color: red
  icon: check-circle
