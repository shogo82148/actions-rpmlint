name: "rpmlint"
description: "run rpmlint"
author: "@shogo82148"
inputs:
  github_token:
    description: "GITHUB_TOKEN."
    default: "${{ github.token }}"
    required: true
  rpmlint_flags:
    description: "Additional rpmlint flags"
    default: ""
    required: false
runs:
  using: "docker"
  image: 'docker://ghcr.io/shogo82148/actions-rpmlint:v0.2.7@sha256:61f726f495d111a9d273afa378913f77a9979b68be76549a54cc82b5505d9882'
branding:
  color: red
  icon: check-circle
