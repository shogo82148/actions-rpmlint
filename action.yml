name: "rpmlint"
description: "run rpmlint"
author: "@shogo82148"
inputs:
  github_token:
    description: "GITHUB_TOKEN."
    default: "${{ github.token }}"
    required: true
  rpmlint_flags:
    description: "Additional rpmlint flags"
    default: ""
    required: false
runs:
  using: "docker"
  image: 'docker://ghcr.io/shogo82148/actions-rpmlint:v0.2.3@sha256:94c0d0ac289b57c1afa3add70a77d109015d4f17fa5947419654e28264d13ff0'
branding:
  color: red
  icon: check-circle
