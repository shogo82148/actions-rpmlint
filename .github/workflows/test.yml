name: test
on: [pull_request]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  rpmlint:
    name: runner / rpmlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test pull request comment helper
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: rpmlint
        uses: ./
        with:
          rpmlint_flags: test/spec/*.spec
