name: Docker Image CI

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag "reviewdog-rpmlint:$(date +%s)"
